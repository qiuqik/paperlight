<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta name="theme-color" content="#f2f5f3" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.9/dist/katex.min.css" integrity="sha384-lPx0C4zIUZLpveABMwOFcFeGZwsvKBJfhJ85FN1PYOV7xApBcFMhcAEMVKF8loOI" crossorigin="anonymous">
  <title>Paperlight · 结构化论文阅读器</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231b6f68'/%3E%3Cpath d='M9 8h10a4 4 0 0 1 4 4v12H13a4 4 0 0 0-4 2V8Z' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M13 13h6M13 17h6' stroke='white' stroke-width='2'/%3E%3C/svg%3E" />
  <style>
    :root{--ink:#172522;--muted:#6c7d79;--line:#dfe8e4;--paper:#fffdfa;--wash:#f4f8f6;--teal:#176f67;--mint:#d8eee8;--amber:#e9b65b;--shadow:0 18px 50px rgba(28,58,51,.08);--body-size:17px;--reading-width:770px}
    *{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:88px}body{margin:0;color:var(--ink);background:#edf3f0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6}button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-rows:64px 1fr}header{background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;gap:11px;font-weight:760;letter-spacing:-.02em}.mark{width:30px;height:30px;border-radius:9px;background:var(--teal);display:grid;place-items:center;color:white;font-size:16px}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:.02em}.tools{display:flex;gap:9px;align-items:center}.tool{border:1px solid var(--line);background:white;border-radius:9px;padding:7px 11px;color:#3f5550;font-size:13px;min-height:38px}.tool:hover,.tool:focus-visible{border-color:#9ac5b9;outline:none}.tool.primary{background:var(--ink);border-color:var(--ink);color:white}.tool.icon{width:38px;padding:0;font-size:16px}.shell{display:grid;grid-template-columns:220px minmax(0,var(--reading-width)) 270px;gap:20px;max-width:1400px;width:100%;margin:auto;padding:26px 24px 60px;align-items:start}.rail,.right{font-size:13px;position:sticky;top:88px;max-height:calc(100vh - 108px);overflow:auto;scrollbar-width:thin}.rail{padding:12px 8px}.eyebrow{font-size:11px;color:var(--teal);font-weight:800;text-transform:uppercase;letter-spacing:.12em;margin:0 0 12px}.docname{font-weight:720;font-size:14px;line-height:1.4;margin-bottom:20px}.toc{border-left:1px solid var(--line);padding-left:13px}.toc button{display:block;border:0;background:none;text-align:left;color:var(--muted);padding:7px 0;width:100%;font-size:13px;line-height:1.4}.toc button:hover{color:var(--ink)}.toc button.active{color:var(--teal);font-weight:750;border-left:2px solid var(--teal);margin-left:-14px;padding-left:12px}.toc .sub{padding-left:12px;font-size:12px}.footer-note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:18px}.reading{background:var(--paper);border:1px solid #e8e9e2;border-radius:14px;box-shadow:var(--shadow);padding:42px 58px;min-height:900px;min-width:0}.paper-meta{display:flex;gap:9px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-bottom:20px}.dot{width:7px;height:7px;background:var(--amber);border-radius:50%;display:inline-block}.tag{background:var(--mint);color:var(--teal);border-radius:99px;padding:3px 9px;font-weight:700;font-size:11px}.reading h1{font-family:Georgia,"Noto Serif SC",serif;font-weight:500;font-size:35px;line-height:1.2;letter-spacing:-.035em;margin:0 0 14px}.authors{font-size:13px;color:var(--muted);margin-bottom:28px}.rule{border:0;border-top:1px solid var(--line);margin:24px 0}.abstract{background:var(--wash);border-radius:11px;padding:18px 20px;margin:0 0 35px;font-family:Georgia,"Noto Serif SC",serif;font-size:15px;line-height:1.8;color:#293c37}.abstract strong{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:12px;color:var(--teal);display:block;margin-bottom:5px}.reading h2{font-family:Georgia,"Noto Serif SC",serif;font-size:23px;font-weight:500;margin:34px 0 10px;line-height:1.4}.reading p{font-family:Georgia,"Noto Serif SC",serif;font-size:var(--body-size);line-height:1.85;color:#293c37;margin:0 0 18px;overflow-wrap:anywhere}.cite{border:0;border-bottom:1px dashed var(--teal);background:none;color:var(--teal);padding:0 2px;font-size:inherit}.cite:hover{background:var(--mint);border-radius:3px}.figure{margin:30px 0 34px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#f7faf8}.figure-art{min-height:180px;display:grid;place-items:center;background:linear-gradient(135deg,#e5f1ed,#f9f5e7);position:relative;padding:24px}.flow{display:flex;align-items:center;gap:10px;font-size:12px;color:#31564e;text-align:center}.flow span{background:white;border:1px solid #a9cec3;border-radius:7px;padding:11px 13px;box-shadow:0 4px 10px #c5d8d280}.flow i{font-style:normal;color:var(--teal);font-size:20px}.caption{padding:11px 15px;font-family:Georgia,serif;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}.reading table{border-collapse:collapse;width:100%;font-size:14px;margin:18px 0 26px}.reading th,.reading td{border:1px solid var(--line);padding:9px 11px;text-align:left}.reading th{background:var(--wash);font-weight:700}.right{padding:0}.panel{background:rgba(255,255,255,.76);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:13px}.panel h3{font-size:13px;margin:0 0 13px}.progress{height:6px;background:#dfeae6;border-radius:99px;overflow:hidden}.progress b{display:block;width:0;height:100%;background:var(--teal);border-radius:inherit;transition:width .2s}.stat{display:flex;justify-content:space-between;gap:8px;margin-top:9px;color:var(--muted);font-size:12px}.ref{padding:11px 0;border-top:1px solid var(--line);font-size:12px;line-height:1.45}.ref:first-of-type{border-top:0}.ref a{color:var(--teal);font-weight:750;text-decoration:none}.ref a:hover{text-decoration:underline}.ref span{color:var(--muted);display:block;margin-top:3px}.layer-state{color:var(--teal)}.citation-card{position:fixed;display:none;width:270px;padding:15px;background:#172522;color:white;border-radius:11px;box-shadow:0 15px 35px #102c2670;font-size:12px;z-index:10;pointer-events:none}.citation-card strong{display:block;font-size:14px;line-height:1.35;margin-bottom:5px}.citation-card em{font-style:normal;color:#abd4c9}.card-action{margin-top:9px;color:#d4e6e1}.settings{position:fixed;inset:0;background:#10211f66;z-index:20;display:none;align-items:center;justify-content:center;padding:18px}.settings.open{display:flex}.settings-card{width:min(360px,100%);background:white;border-radius:14px;padding:20px;box-shadow:0 20px 60px #10211f40}.settings-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.settings-head h2{font-size:16px;margin:0}.close{border:0;background:var(--wash);border-radius:8px;width:34px;height:34px}.setting-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-top:1px solid var(--line);font-size:14px}.setting-row input{width:125px;accent-color:var(--teal)}.setting-row select{border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:white}.mobile-panel{display:none}.empty-note{border:1px dashed #adc9c0;border-radius:10px;padding:18px;color:var(--muted);font-size:14px;background:#fbfdfc}.section-kicker{font-size:11px;color:var(--teal);font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin:28px 0 -25px}.processing{display:none;padding:13px 15px;margin:0 0 18px;border-radius:9px;background:#f7f4e8;color:#705b27;font-size:13px}.processing.show{display:block}.error{color:#a43c32}.ref-target{scroll-margin-top:100px}.hidden-input{display:none}
    @media(max-width:1120px){.shell{grid-template-columns:190px minmax(0,1fr);max-width:1000px}.right{display:none}.reading{padding:38px 52px}.mobile-panel{display:flex;gap:8px;padding:10px 14px;background:#edf3f0;border-bottom:1px solid var(--line)}.mobile-panel button{border:1px solid var(--line);background:white;border-radius:8px;padding:6px 10px;font-size:13px;color:#3f5550}}
    @media(max-width:700px){.app{grid-template-rows:58px 1fr}header{padding:0 13px}.brand{gap:8px}.brand small{font-size:9px}.mark{width:28px;height:28px}.tools{gap:6px}.tools .tool.settings-trigger{display:none}.tool{padding:6px 9px;font-size:12px;min-height:36px}.tool.icon{width:36px;padding:0}.shell{display:block;padding:10px 10px 36px}.rail,.right{display:none}.reading{padding:26px 20px;border-radius:10px;min-height:0}.reading h1{font-size:29px}.reading h2{font-size:21px}.reading p{font-size:16px;line-height:1.8}.figure-art{min-height:150px;padding:16px}.flow{gap:5px;font-size:11px}.flow span{padding:8px}.flow i{font-size:16px}.mobile-panel{padding:8px 10px}.paper-meta{margin-bottom:15px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important}}
    .read-progress{font-size:12px;color:var(--muted);margin-right:8px;white-space:nowrap}.read-progress strong{color:var(--teal)}
    .rail .eyebrow{margin-bottom:14px}.toc .level-2{padding-left:13px}.toc .level-3{padding-left:25px;font-size:12px}
    .reading h2{font-weight:600}.reading h3{font-family:Georgia,"Noto Serif SC",serif;font-size:17px;margin:25px 0 9px;font-weight:700;line-height:1.5}.reading .label{font-weight:700;color:var(--ink)}.reading .index-terms{font-family:Georgia,"Noto Serif SC",serif;font-size:14px;margin:-24px 0 30px;color:var(--muted)}
    .reader-tools{display:flex;justify-content:flex-end;color:var(--muted);font-size:11px;margin:-20px 0 18px}.reader-tools strong{color:var(--teal)}
    .reading h4{font-family:Georgia,"Noto Serif SC",serif;font-size:15px;margin:20px 0 8px;font-weight:750}.reading ul{margin:4px 0 22px;padding-left:1.35em;color:#293c37;font-family:Georgia,"Noto Serif SC",serif;font-size:var(--body-size);line-height:1.8}.reading li{padding-left:4px;margin:5px 0}.equation{overflow:auto;text-align:center;padding:15px;background:var(--wash);border-radius:8px;margin:18px 0 24px;font-family:Georgia,serif;font-size:18px}
    .side-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 9px}.side-tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:7px 2px;color:var(--muted);font-size:12px}.side-tabs button.active{border-color:var(--teal);color:var(--teal);font-weight:750}.side-content{display:none}.side-content.active{display:block}.right .panel{padding:14px}.right .panel h3{margin-bottom:8px}.compact-progress{color:var(--muted);font-size:12px}.compact-progress strong{color:var(--teal)}
    .ref.current{background:#e9f5f1;margin:0 -8px;padding:10px 8px;border-radius:7px}.ref.flash{animation:ref-flash 1.7s ease-out}@keyframes ref-flash{0%{background:#c9eadf}100%{background:transparent}}.cite+.cite{margin-left:3px}.citation-card .preview{display:block;margin-top:8px;color:#d4e6e1;font-style:normal;font-size:11px;line-height:1.5}.citation-card .preview img{display:block;width:100%;max-height:115px;object-fit:contain;background:#fff;border-radius:5px;margin:4px 0 7px}
    .figure-card{margin:20px 0 25px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#f6faf8}.figure-card button{display:block;border:0;padding:0;width:100%;background:none}.figure-card img{display:block;width:100%;max-height:620px;object-fit:contain;background:#fff;cursor:zoom-in}.figure-card figcaption{padding:10px 14px;font-family:Georgia,serif;font-size:13px;color:var(--muted)}.asset-nav{display:flex;flex-direction:column;gap:3px}.asset-nav button{border:0;background:none;text-align:left;padding:7px 4px;color:var(--muted);font-size:12px;border-radius:6px}.asset-nav button:hover{background:var(--wash);color:var(--teal)}
    .table-card{margin:18px 0 26px;border:1px solid var(--line);border-radius:9px;overflow:hidden}.table-card figcaption{padding:10px 13px;font-family:Georgia,serif;font-size:13px;color:var(--muted)}.table-scroll{overflow:auto;max-width:100%}.table-card table{border-collapse:collapse;width:100%;min-width:max-content;margin:0;font-size:13px}.table-card th,.table-card td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}.table-card th{background:var(--wash)}.table-card td.best{font-weight:750}.table-card td.underlined{text-decoration:underline;text-underline-offset:2px}.table-card button.table-open{display:block;border:0;background:transparent;color:var(--teal);font-size:11px;padding:5px 12px 9px;margin-left:auto}
    .figure-link,.table-link{border:0;background:none;color:var(--teal);padding:0 1px;border-bottom:1px dashed var(--teal);font:inherit;cursor:pointer}.figure-link:hover,.table-link:hover{background:var(--mint)}
    .viewer{position:fixed;inset:0;background:#101917e8;z-index:30;display:none;align-items:center;justify-content:center;padding:24px}.viewer.open{display:flex}.viewer-inner{position:relative;max-width:min(1200px,96vw);max-height:92vh;overflow:auto;background:var(--paper);border-radius:12px;padding:15px}.viewer-inner img{display:block;max-width:100%;max-height:78vh;margin:auto;object-fit:contain}.viewer-inner table{margin:12px 0}.viewer-close{position:sticky;top:0;float:right;border:0;border-radius:50%;width:38px;height:38px;background:#172522;color:#fff;z-index:1;font-size:21px}.viewer-caption{clear:both;padding:10px 4px 2px;color:var(--muted);font-family:Georgia,serif;font-size:14px}.paper-doi{font-size:12px;color:var(--teal);text-decoration:none}.paper-doi:hover{text-decoration:underline}.paper-extra{margin:10px 0 22px}.paper-extra summary{font-size:12px;color:var(--muted);cursor:pointer}.paper-extra div{padding:9px 0;color:var(--muted);font-size:13px}.notice{font-size:12px;color:#7a6a3d;background:#f8f4e7;border-radius:8px;padding:10px 12px;margin:0 0 18px}
    .setting-api{display:block;padding:14px 0 4px;border-top:1px solid var(--line);font-size:13px;font-weight:650}.setting-api input{display:block;width:100%;margin-top:7px;border:1px solid var(--line);border-radius:7px;padding:8px;font-size:12px}.setting-hint{margin:2px 0 0;color:var(--muted);font-size:11px;line-height:1.5}.reading h3{font-family:Georgia,"Noto Serif SC",serif;font-size:18px;font-weight:700;margin:27px 0 9px;line-height:1.45}.reading h4{font-weight:750}.reading .label{font-weight:750}.citation-card .preview{max-height:165px;overflow:auto}.citation-card .preview table{width:100%;font-size:10px;border-collapse:collapse}.citation-card .preview th,.citation-card .preview td{padding:3px;border:1px solid #ffffff55}
    .footnote{margin:5px 0 18px 18px;padding:8px 12px;border-left:2px solid var(--line);font-size:12px;line-height:1.55;color:var(--muted)}.requirement{margin:12px 0 18px;padding:13px 15px;border-left:3px solid var(--teal);border-radius:0 8px 8px 0;background:var(--wash);font-family:Georgia,"Noto Serif SC",serif;font-size:15px;line-height:1.65}.requirement::first-line{font-weight:750}.reading blockquote{margin:15px 0;padding:12px 18px;border-left:3px solid var(--teal);background:var(--wash);font-family:Georgia,"Noto Serif SC",serif}
    .reading section:not(.abstract) p[data-reader-paragraph]{text-indent:1.6em}
    .paper-extra ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}.paper-extra li{border-left:2px solid var(--line);padding:7px 0 7px 12px;color:var(--muted);font-size:13px;line-height:1.6;overflow-wrap:anywhere}
    @media(max-width:1120px){.read-progress{display:none}.right{display:none!important}.right.mobile-open{display:block!important;position:relative;top:auto;max-height:none;margin:0 0 12px}.rail.mobile-open{display:block!important;position:relative;top:auto;max-height:none;margin:0 0 12px}.shell{display:flex;flex-direction:column}.reading{width:100%;order:2}.rail{width:100%;order:1}.right{width:100%;order:3}}
    @media(max-width:700px){.shell{display:flex}.rail,.right{display:none}.right.mobile-open,.rail.mobile-open{display:block!important}.reading{order:2}.rail{order:1}.right{order:3}.viewer{padding:10px}.viewer-inner{padding:10px}.reading h2{font-size:22px}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="mark" aria-hidden="true">▤</div><div>Paperlight<small>STRUCTURE-FIRST READING</small></div></div>
    <div class="tools"><span class="read-progress" id="topProgress" aria-live="polite"></span><button class="tool settings-trigger" id="settingsButton" type="button">Aa 阅读设置</button><button class="tool icon" id="themeButton" type="button" aria-label="切换阅读背景" title="切换阅读背景">☼</button><button class="tool primary" id="importButton" type="button">导入 PDF</button><input class="hidden-input" id="pdfInput" type="file" accept="application/pdf,.pdf" /></div>
  </header>
  <div class="mobile-panel"><button type="button" id="tocToggle">☷ 目录</button><button type="button" id="refsToggle">↗ 文献与图表</button><span id="mobileDocTitle" style="margin:auto 0 auto auto;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span></div>
  <main class="shell">
    <aside class="rail" id="leftRail"><p class="eyebrow">Contents</p><nav class="toc" id="toc" aria-label="论文目录"></nav></aside>
    <article class="reading" id="article" aria-live="polite"></article>
    <aside class="right" id="rightRail"><section class="panel"><nav class="side-tabs" role="tablist" aria-label="论文材料"><button type="button" class="active" role="tab" aria-selected="true" data-tab="references">References <span id="refCount"></span></button><button type="button" role="tab" aria-selected="false" data-tab="figures">Figures</button><button type="button" role="tab" aria-selected="false" data-tab="tables">Tables</button></nav><div class="side-content active" id="references" role="tabpanel"></div><div class="side-content" id="figures" role="tabpanel"></div><div class="side-content" id="tables" role="tabpanel"></div></section></aside>
  </main>
</div>
<div class="citation-card" id="citationCard" role="tooltip"><strong id="cardTitle"></strong><em id="cardMeta"></em><div class="preview" id="cardPreview"></div><div class="card-action">查看参考文献 →</div></div>
<div class="settings" id="settings" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><div class="settings-card"><div class="settings-head"><h2 id="settingsTitle">阅读设置</h2><button class="close" id="closeSettings" type="button" aria-label="关闭">×</button></div><label class="setting-row">正文字号 <input id="fontSize" type="range" min="15" max="22" value="17" /></label><label class="setting-row">阅读宽度 <select id="contentWidth"><option value="700px">紧凑</option><option value="770px" selected>标准</option><option value="850px">宽</option></select></label><label class="setting-api">Parser API URL <input id="parserApiUrl" type="url" placeholder="留空时自动尝试本机 API" autocomplete="url" /></label><p class="setting-hint">可填写部署后的 HTTPS API 地址；本机打开时默认尝试 http://127.0.0.1:8000。连接失败会改用浏览器本地解析。</p></div></div>
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="图表预览"><div class="viewer-inner"><button class="viewer-close" id="viewerClose" type="button" aria-label="关闭预览">×</button><div id="viewerContent"></div><div class="viewer-caption" id="viewerCaption"></div></div></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
