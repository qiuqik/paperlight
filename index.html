    .note-toolbar{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:8;display:flex;gap:5px;align-items:center;padding:7px 9px;border:1px solid var(--line);border-radius:12px;background:var(--paper);box-shadow:var(--shadow)}.note-toolbar button,.note-toolbar select{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:7px;padding:6px;font-size:12px}.note-toolbar button.active{background:var(--mint);border-color:var(--teal)}.note-toolbar input[type=color]{width:31px;height:30px;padding:1px;border:0;background:none}.note-toolbar[data-dock=bottom]{top:auto;bottom:16px}.note-toolbar[data-dock=left]{top:50%;left:12px;transform:translateY(-50%);flex-direction:column}.note-toolbar[data-dock=right]{top:50%;left:auto;right:12px;transform:translateY(-50%);flex-direction:column}.note-toolbar[data-dock=left] select,.note-toolbar[data-dock=right] select{max-width:60px}
    .reader-highlight{background:var(--annotation-color,#ffe59a)}.reader-highlight[data-mode=underline]{background:transparent;text-decoration:underline 2px var(--annotation-color);text-underline-offset:3px}.reader-highlight[data-mode=area]{background:color-mix(in srgb,var(--annotation-color) 34%,transparent);outline:1px solid var(--annotation-color)}.note-item[data-note-color]{border-left:3px solid var(--note-color);padding-left:9px;background:color-mix(in srgb,var(--note-color) 10%,transparent)}
    .shell.reader-expanded{display:block;max-width:none;padding:22px max(16px,calc((100vw - var(--reading-width) - 110px)/2))}.shell.reader-expanded .reading{width:100%}.shell.reader-expanded .rail,.shell.reader-expanded .right{display:none}.shell.reader-expanded .rail.expanded-open,.shell.reader-expanded .right.expanded-open{display:block;position:fixed;top:76px;bottom:16px;max-height:none;width:280px;z-index:9;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:auto;padding:16px}.shell.reader-expanded .rail.expanded-open{left:12px}.shell.reader-expanded .right.expanded-open{right:12px}.reader-dock{position:fixed;top:50%;z-index:7;display:none;flex-direction:column;gap:7px}.reader-expanded .reader-dock{display:flex}.reader-dock.left{left:9px}.reader-dock.right{right:9px}.reader-dock button{border:1px solid var(--line);background:var(--paper);color:var(--teal);border-radius:9px;width:36px;height:36px;box-shadow:var(--shadow)}.history-source{display:flex;gap:8px;margin-top:14px}.history-source button.active{background:var(--mint);border-color:var(--teal)}
    .shell.reader-expanded .reader-dock.right{display:flex;width:auto;padding:0;background:none;border:0;box-shadow:none}
    .paper-extra ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}.paper-extra li{border-left:2px solid var(--line);padding:7px 0 7px 12px;color:var(--muted);font-size:13px;line-height:1.6;overflow-wrap:anywhere}
    @media(max-width:1120px){.read-progress{display:none}.right{display:none!important}.right.mobile-open{display:block!important;position:relative;top:auto;max-height:none;margin:0 0 12px}.rail.mobile-open{display:block!important;position:relative;top:auto;max-height:none;margin:0 0 12px}.shell{display:flex;flex-direction:column}.reading{width:100%;order:2}.rail{width:100%;order:1}.right{width:100%;order:3}}
    @media(max-width:700px){.shell{display:flex}.rail,.right{display:none}.right.mobile-open,.rail.mobile-open{display:block!important}.reading{order:2}.rail{order:1}.right{order:3}.viewer{padding:10px}.viewer-inner{padding:10px}.reading h2{font-size:22px}}
    @media print{
      @page{margin:14mm}
      html,body{background:#fff!important;color:#000!important}
      .app{display:block!important;min-height:0!important}
      header,.rail,.right,.rail.mobile-open,.right.mobile-open,.mobile-panel,.citation-card,.settings,.viewer,.reader-tools,.processing,.note-toolbar,.reader-dock{display:none!important}
      .shell{display:block!important;width:100%!important;max-width:none!important;margin:0!important;padding:0!important}
      .reading{display:block!important;width:100%!important;max-width:none!important;min-height:0!important;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;overflow:visible!important;background:#fff!important}
      .figure-card{break-inside:avoid;page-break-inside:avoid;overflow:visible}
      .figure-card img{width:100%!important;height:auto!important;max-height:none!important;object-fit:contain}
      .reading h1,.reading h2,.reading h3,.reading h4{break-after:avoid;page-break-after:avoid}
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="mark" aria-hidden="true">▤</div><div>Paperlight<small>STRUCTURE-FIRST READING</small></div></div>
    <div class="tools"><span class="read-progress" id="topProgress" aria-live="polite"></span><button class="tool" id="historyButton" type="button">历史记录</button><button class="tool icon" id="expandReader" type="button" aria-label="放大阅读区" title="放大阅读区">⛶</button><button class="tool icon" id="settingsButton" type="button" aria-label="设置" title="设置">⚙</button><button class="tool primary" id="importButton" type="button">导入 PDF</button><input class="hidden-input" id="pdfInput" type="file" accept="application/pdf,.pdf" /></div>
  </header>
  <div class="mobile-panel"><button type="button" id="tocToggle">☷ 目录</button><button type="button" id="refsToggle">↗ 文献与图表</button><span id="mobileDocTitle" style="margin:auto 0 auto auto;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span></div>
  <main class="shell">
    <div class="reader-dock left"><button type="button" data-open-panel="toc" title="目录" aria-label="目录">☰</button></div><div class="reader-dock right"><button type="button" data-open-panel="references" title="参考文献" aria-label="参考文献">文</button><button type="button" data-open-panel="figures" title="图片" aria-label="图片">图</button><button type="button" data-open-panel="tables" title="表格" aria-label="表格">表</button><button type="button" data-open-panel="notes" title="笔记" aria-label="笔记">✎</button></div>
    <aside class="rail" id="leftRail"><p class="eyebrow">Contents</p><nav class="toc" id="toc" aria-label="论文目录"></nav></aside>
    <article class="reading" id="article" aria-live="polite"></article>
    <aside class="right" id="rightRail"><section class="panel"><nav class="side-tabs" role="tablist" aria-label="论文材料"><button type="button" class="active" role="tab" aria-selected="true" data-tab="references">References <span id="refCount"></span></button><button type="button" role="tab" aria-selected="false" data-tab="figures">Figures</button><button type="button" role="tab" aria-selected="false" data-tab="tables">Tables</button><button type="button" role="tab" aria-selected="false" data-tab="notes">笔记</button></nav><div class="side-content active" id="references" role="tabpanel"></div><div class="side-content" id="figures" role="tabpanel"></div><div class="side-content" id="tables" role="tabpanel"></div><div class="side-content" id="notes" role="tabpanel"></div></section></aside>
  </main>
</div>
<div class="citation-card" id="citationCard" role="dialog" aria-label="引用预览"><strong id="cardTitle"></strong><em id="cardMeta"></em><div class="preview" id="cardPreview"></div><button type="button" class="card-action" id="cardAction">查看参考文献 →</button></div>
<div class="note-toolbar" id="noteToolbar" data-dock="top" aria-label="笔记工具"><button type="button" data-annotation-mode="highlight" class="active">高亮</button><button type="button" data-annotation-mode="underline">下划线</button><button type="button" data-annotation-mode="area">区域</button><select id="annotationPreset" aria-label="批注颜色"><option value="#ffe59a">黄色</option><option value="#f5b9b3">红色</option><option value="#bce9cc">绿色</option><option value="#bcd6f5">蓝色</option><option value="#dcc7f5">紫色</option></select><input id="annotationColor" type="color" value="#ffe59a" aria-label="自定义批注颜色"><label style="font-size:12px;white-space:nowrap"><input id="annotationNote" type="checkbox"> 写笔记</label></div>
<div class="annotation-toolbar" id="annotationToolbar"><button type="button" id="highlightSelection">应用批注</button><button type="button" id="noteSelection">添加笔记</button></div>
<div class="history-dialog" id="historyDialog" role="dialog" aria-modal="true" aria-labelledby="historyTitle"><div class="history-card"><div class="history-head"><h2 id="historyTitle">历史记录</h2><button class="close" id="closeHistory" type="button" aria-label="关闭历史记录">×</button></div><div class="history-source"><button type="button" data-history-source="local" class="active">此浏览器</button><button type="button" data-history-source="server">本机服务器</button></div><p class="history-tip" id="historyTip">此浏览器保存导入的 PDF；其他电脑可各自导入，也可以从本机服务器读取。</p><div class="history-list" id="historyList"></div></div></div>
<div class="settings" id="settings" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><div class="settings-card"><div class="settings-head"><h2 id="settingsTitle">设置</h2><button class="close" id="closeSettings" type="button" aria-label="关闭">×</button></div><label class="setting-row">正文字号 <input id="fontSize" type="range" min="14" max="26" value="17" /></label><label class="setting-row">阅读宽度 <select id="contentWidth"><option value="700px">紧凑</option><option value="770px" selected>标准</option><option value="850px">宽</option><option value="1000px">超宽</option></select></label><label class="setting-row">渲染字体 <select id="readerFont"><option value="serif">衬线</option><option value="sans">无衬线</option><option value="mono">等宽</option></select></label><label class="setting-row">主题 <select id="readerTheme"><option value="light">明亮</option><option value="sepia">暖纸</option><option value="dark">深色</option><option value="custom">自定义</option></select></label><label class="setting-row">纸张颜色 <input id="customPaper" type="color" value="#fffdfa"></label><label class="setting-row">文字颜色 <input id="customInk" type="color" value="#172522"></label><label class="setting-row">工具栏位置 <select id="toolbarDock"><option value="top">顶部</option><option value="bottom">底部</option><option value="left">左侧</option><option value="right">右侧</option></select></label><label class="setting-api">Parser API URL <input id="parserApiUrl" type="url" placeholder="留空时自动尝试本机 API" autocomplete="url" /></label><p class="setting-hint">本机或 Tailscale 私网 API。浏览器设置会自动保存；可用下方档案码在另一台电脑同步。</p><label class="setting-api">同步档案码 <input id="profileId" type="text" pattern="[a-f0-9]{32}" placeholder="32 位档案码"></label><div class="setting-actions"><button type="button" id="loadProfile">从服务器读取设置</button><span id="profileStatus" class="profile-code"></span></div></div></div>
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="图表预览"><div class="viewer-inner"><button class="viewer-close" id="viewerClose" type="button" aria-label="关闭预览">×</button><div id="viewerContent"></div><div class="viewer-caption" id="viewerCaption"></div></div></div>
<script>
  window.paperlightStartupError=function(message){
    if(window.__paperlightReady)return;
    const article=document.getElementById('article');
    if(!article)return;
    article.innerHTML='';
    const box=document.createElement('div');box.className='empty-note';
    const title=document.createElement('strong');title.textContent='阅读器未能启动';
    const detail=document.createElement('p');detail.textContent=message||'网页脚本未能加载。';
    const retry=document.createElement('button');retry.type='button';retry.textContent='重新加载页面';retry.onclick=()=>location.reload();
    box.append(title,detail,retry);article.append(box);
  };
  window.addEventListener('error',event=>window.paperlightStartupError(event.message));
  window.addEventListener('unhandledrejection',event=>window.paperlightStartupError(String(event.reason)));
  setTimeout(()=>{if(!window.__paperlightReady)window.paperlightStartupError('网页脚本未能完成初始化。');},6000);
</script>
<script type="module" src="./src/main.js?v=20260927-2" onerror="window.paperlightStartupError('网页脚本加载失败，请刷新页面。')"></script>
</body>
</html>
