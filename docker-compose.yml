services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${PAPERLIGHT_WEB_BIND:-127.0.0.1}:8040:8040"
    environment:
      PAPERLIGHT_PARSER_URL: http://parser:8000
      PAPERLIGHT_PUBLIC_ORIGIN: ${PAPERLIGHT_PUBLIC_ORIGIN:-https://desktop-c0d40qs.tailc57931.ts.net}
    depends_on:
      - parser
    restart: unless-stopped
  parser:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      GROBID_URL: http://grobid:8070
      PAPERLIGHT_DATA_DIR: /userdata/documents
      PAPERLIGHT_LIBRARY_DIR: /userdata/library
      PAPERLIGHT_RESULT_DIR: /result
      PAPERLIGHT_REFERENCE_MODE: ${PAPERLIGHT_REFERENCE_MODE:-auto}
      PAPERLIGHT_DEEPSEEK_API_KEY: ${PAPERLIGHT_DEEPSEEK_API_KEY:-}
      PAPERLIGHT_DOUBAO_API_KEY: ${PAPERLIGHT_DOUBAO_API_KEY:-}
      PAPERLIGHT_DOUBAO_VISION_MODEL: ${PAPERLIGHT_DOUBAO_VISION_MODEL:-}
      HF_HOME: /models/huggingface
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "60"
    volumes:
      - ./userdata:/userdata
      - ./result:/result
      - docling-model-cache:/models
    depends_on:
      - grobid
    restart: unless-stopped
  grobid:
    image: grobid/grobid:0.9.1-crf
    platform: linux/amd64
    ulimits:
      core: 0
    restart: unless-stopped

volumes:
  docling-model-cache:
