services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PAPERLIGHT_BIND_HOST:-127.0.0.1}:${PAPERLIGHT_API_PORT:-8000}:8000"
    environment:
      GROBID_URL: http://grobid:8070
      PAPERLIGHT_DATA_DIR: /userdata/documents
      PAPERLIGHT_LIBRARY_DIR: /userdata/library
      PAPERLIGHT_REFERENCE_MODE: ${PAPERLIGHT_REFERENCE_MODE:-auto}
      PAPERLIGHT_RESULT_DIR: /result
      PAPERLIGHT_CORS_ORIGINS: ${PAPERLIGHT_CORS_ORIGINS:-http://localhost:8040,http://127.0.0.1:8040}
      HF_HOME: /models/huggingface
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "60"
    volumes:
      - ./storage:/data
      - ../userdata:/userdata
      - ../result:/result
      - docling-model-cache:/models
    depends_on:
      - grobid
    restart: unless-stopped
  grobid:
    image: grobid/grobid:0.9.1-crf
    platform: linux/amd64
    ulimits:
      core: 0
    restart: unless-stopped

volumes:
  docling-model-cache:
